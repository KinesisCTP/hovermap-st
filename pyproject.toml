[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kinesis-hovermap-mcp"
version = "0.1.0"
description = "Headless MCP tools for the KINESIS Hovermap ST direct HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "KINESIS Core Technology Platforms" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: Other/Proprietary License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "anyio>=4.9,<5",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "hatchling>=1.27,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
hovermap-mcp = "hovermap_mcp.server:main"

[project.urls]
Repository = "https://github.com/KinesisCTP/hovermap-st"
Source = "https://github.com/KinesisCTP/hovermap-st/tree/direct-api"
Documentation = "https://github.com/KinesisCTP/hovermap-st/blob/direct-api/README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hovermap_direct", "src/hovermap_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
