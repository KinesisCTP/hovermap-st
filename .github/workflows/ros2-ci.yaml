name: ROS 2 Jazzy CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  pure-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run golden codec and mocked HTTP tests
        env:
          PYTHONPATH: src/hovermap_ros2_api
        run: >-
          python -W error::ResourceWarning -m unittest discover
          -s src/hovermap_ros2_api/test -v

  jazzy-build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools and declared dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-avro \
            ros-dev-tools
          rosdep update
          rosdep install --from-paths \
            src/hovermap_ros2_msgs src/hovermap_ros2_api \
            --ignore-src -r -y
      - name: Import pinned Mule core
        shell: bash
        run: vcs import . < hovermap_ros2_core_https.repos
      - name: Smoke-test the real Mule core on Python 3.12
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source scripts/source_mule_core.sh
          export PYTHONPATH="${PWD}/src/hovermap_ros2_api:${PYTHONPATH}"
          python3 tools/smoke_mule_core.py \
            --expected-root third_party/hovermap_ros_api \
            --expected-commit 1608fb74784977b69936590b9cda8340a1fe3013 \
            --instantiate-client
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --base-paths src/hovermap_ros2_msgs src/hovermap_ros2_api \
            --event-handlers console_direct+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          source scripts/source_mule_core.sh
          colcon test \
            --base-paths src/hovermap_ros2_msgs src/hovermap_ros2_api \
            --event-handlers console_direct+
          colcon test-result --verbose
