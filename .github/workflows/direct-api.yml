name: Direct API MCP

on:
  push:
    branches: [direct-api]
  pull_request:
    branches: [direct-api]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lockfile runner
        run: python -m pip install 'uv==0.12.13'
      - name: Verify lockfile and shell script
        run: |
          uv lock --check
          bash -n scripts/preflight_network.sh
      - name: Sync locked project and test tools
        run: uv sync --locked --extra dev --python python
      - name: Lint and format check
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Unit and integration tests
        run: uv run --locked pytest

  wheel-and-stdio:
    name: Built wheel and real stdio handshake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install lockfile runner
        run: python -m pip install 'uv==0.12.13'
      - name: Sync locked build environment
        run: uv sync --locked --extra dev --python python
      - name: Build distributions
        run: uv run --locked python -m build --no-isolation
      - name: Export locked runtime dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project
          --format requirements.txt --output-file .runtime-requirements.txt
      - name: Install wheel in a clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --require-hashes -r .runtime-requirements.txt
          .wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          .wheel-venv/bin/python -m pip check
      - name: Verify installed MCP stdio contract
        run: >-
          .wheel-venv/bin/python scripts/check_stdio_contract.py
          --command "$PWD/.wheel-venv/bin/hovermap-mcp"
          --require-installed-wheel
