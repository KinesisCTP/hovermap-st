name: ROS 1 Noetic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils shellcheck

      - name: Check shell, XML, and Python syntax
        run: |
          shellcheck containers/ros1_noetic/*.sh scripts/*.sh
          find src -type f \( -name 'package.xml' -o -name '*.launch' \) \
            -print0 | xargs -0 -n1 xmllint --noout
          python3 -m py_compile src/hovermap_st_bringup/scripts/tf_relay

      - name: Build the documented ROS 1 image
        run: |
          docker build \
            -t local/kinesis-hovermap-st-noetic:ci \
            containers/ros1_noetic
          docker run --rm local/kinesis-hovermap-st-noetic:ci \
            python3 -c 'import avro, catkin_pkg, netifaces, tornado, zmq'

  build-and-test:
    runs-on: ubuntu-latest
    container: osrf/ros:noetic-desktop-full
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Install workspace tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git \
            python3-catkin-tools \
            python3-dev \
            python3-nose \
            python3-pip \
            python3-rosdep \
            python3-vcstool
          rm -rf /var/lib/apt/lists/*

      - name: Import Hovermap source
        run: vcs import src < hovermap_kinesis_https.repos

      - name: Install dependencies
        run: |
          source /opt/ros/noetic/setup.bash
          python3 -m pip install -r \
            src/hovermap_ros_api/src/mule_bridge/mule_bridge/requirements.txt
          rosdep update --rosdistro noetic
          rosdep install --from-paths src --ignore-src -r -y --rosdistro noetic

      - name: Build
        run: |
          source /opt/ros/noetic/setup.bash
          catkin init
          catkin config --extend /opt/ros/noetic --cmake-args -DCMAKE_BUILD_TYPE=Release
          catkin build --no-status

      - name: Test
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          catkin test --no-status
          catkin_test_results --all build
